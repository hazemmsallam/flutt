name: ticketing_mobile
description: Mobile client for the event-ticketing API — browse events and pick seats on a live seat map.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  barcode_widget: ^2.0.4
  file_picker: ^13.3.3
  flutter:
    sdk: flutter
  http: ^1.2.0
  intl: ^0.20.3
  share_plus: ^13.3.1
  shared_preferences: ^2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
